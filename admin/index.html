<!doctype html><html lang="en"><head><!-- Publisher is noindexed because this client-side version is only a starter. --><title>Fynvera Publisher</title><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/css/style.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="../index.html"><span class="brand-mark">↗</span><span class="brand-text">FYNVERA<small>Publisher</small></span></a><a class="btn btn-outline" href="../articles.html">View Articles</a></div></header><main class="container"><section class="page-hero"><div class="eyebrow">CONTENT DASHBOARD</div><h1>Publish a daily article.</h1><p class="muted">This free starter stores content in the current browser. Save your generated image under assets/images/ with the same filename.</p></section><div class="form-wrap"><div class="form-card"><div class="field"><label>Title</label><input id="title"></div><div class="field"><label>Date</label><input id="date" type="date"></div><div class="field"><label>Category</label><select id="category"></select></div><div class="field"><label>Reading time</label><input id="read" value="6 min"></div><div class="field"><label>Image filename</label><input id="image" value="assets/images/new-article.jpg"><small class="muted">IMAGE PLACEHOLDER: save your generated image at this path.</small></div><div class="field"><label>Primary SEO keyword</label><input id="keyword"></div><div class="field"><label>Excerpt</label><textarea id="excerpt"></textarea></div><div class="field"><label>Article HTML</label><textarea id="content" placeholder="&lt;p&gt;Your original article...&lt;/p&gt;&lt;h2&gt;Heading&lt;/h2&gt;&lt;p&gt;More...&lt;/p&gt;"></textarea></div><button class="btn btn-primary" id="publish">Publish</button><p id="status" class="small"></p></div></div></main><footer class="footer"><div class="container footer-bottom">© 2026 Fynvera.</div></footer><script src="../assets/js/data.js"></script><script>/* Fill categories from the shared content configuration. */const c=document.getElementById('category');FYNVERA_CATEGORIES.forEach(x=>c.insertAdjacentHTML('beforeend',`<option>${x.name}</option>`));/* Save a browser-only article; production publishing needs real authentication and storage. */document.getElementById('publish').onclick=()=>{const title=document.getElementById('title').value.trim(),date=document.getElementById('date').value,content=document.getElementById('content').value.trim();if(!title||!date||!content){document.getElementById('status').textContent='Title, date and content are required.';return}const id=title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');const a={id,title,date,cat:c.value,read:document.getElementById('read').value,image:document.getElementById('image').value,excerpt:document.getElementById('excerpt').value,keyword:document.getElementById('keyword').value,content};const arr=JSON.parse(localStorage.getItem('fynvera_articles')||'[]');arr.unshift(a);localStorage.setItem('fynvera_articles',JSON.stringify(arr));document.getElementById('status').textContent='Saved in this browser. Add the generated image and refresh the article library.'}</script></body></html>
