<!doctype html><html lang="en"><head><!-- SEO metadata for this calculator page. --><title>Inflation Calculator | Fynvera</title><meta name="description" content="Free inflation calculator from Fynvera. Estimate a future price with an annual inflation assumption."><meta name="keywords" content="inflation calculator, finance calculator, financial tools"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/css/style.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="../index.html"><span class="brand-mark">↗</span><span class="brand-text">FYNVERA<small>Understand Money. Build Wealth.</small></span></a><nav class="nav-main"><a href="../index.html">Home</a><a href="../articles.html">Articles</a><a href="../index.html#categories">Categories</a></nav><div class="nav-actions"><a class="btn btn-primary" href="../login.html">Account</a></div></div></header><main class="container"><section class="page-hero"><div class="eyebrow">FREE FINANCIAL TOOL</div><h1>Inflation Calculator</h1><p class="muted">Estimate a future price with an annual inflation assumption.</p></section><div class="form-wrap"><div class="form-card"><div class="field"><label for="amount">Current amount</label><input id="amount" type="number" min="0" step="any" placeholder="0"></div><div class="field"><label for="rate">Annual inflation (%)</label><input id="rate" type="number" min="0" step="any" placeholder="0"></div><div class="field"><label for="years">Years</label><input id="years" type="number" min="0" step="any" placeholder="0"></div><button class="btn btn-primary" id="calculate">Calculate</button><div id="out" class="result">Enter values to calculate.</div><p class="small muted">Illustrative calculation only. Not personalised financial advice.</p></div></div></main><footer class="footer"><div class="container footer-bottom">© 2026 Fynvera.</div></footer><script>/* Calculator formula: kept in one block for easy maintenance. */const result=t=>document.getElementById('out').textContent=t;const amount=document.getElementById("amount").value;const rate=document.getElementById("rate").value;const years=document.getElementById("years").value;document.getElementById('calculate').onclick=()=>{const p=+amount||0,r=(+rate||0)/100,y=+years||0;result(`Estimated future cost: ${(p*Math.pow(1+r,y)).toLocaleString(undefined,{maximumFractionDigits:2})}`);}</script></body></html>
