<!doctype html><html lang="en"><head><!-- SEO metadata for this calculator page. --><title>Retirement Planner | Fynvera</title><meta name="description" content="Free retirement planner from Fynvera. Explore a simple savings projection."><meta name="keywords" content="retirement planner, finance calculator, financial tools"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/css/style.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="../index.html"><span class="brand-mark">↗</span><span class="brand-text">FYNVERA<small>Understand Money. Build Wealth.</small></span></a><nav class="nav-main"><a href="../index.html">Home</a><a href="../articles.html">Articles</a><a href="../index.html#categories">Categories</a></nav><div class="nav-actions"><a class="btn btn-primary" href="../login.html">Account</a></div></div></header><main class="container"><section class="page-hero"><div class="eyebrow">FREE FINANCIAL TOOL</div><h1>Retirement Planner</h1><p class="muted">Explore a simple savings projection.</p></section><div class="form-wrap"><div class="form-card"><div class="field"><label for="current">Current savings</label><input id="current" type="number" min="0" step="any" placeholder="0"></div><div class="field"><label for="monthly">Monthly contribution</label><input id="monthly" type="number" min="0" step="any" placeholder="0"></div><div class="field"><label for="rate">Annual return (%)</label><input id="rate" type="number" min="0" step="any" placeholder="0"></div><div class="field"><label for="years">Years</label><input id="years" type="number" min="0" step="any" placeholder="0"></div><button class="btn btn-primary" id="calculate">Calculate</button><div id="out" class="result">Enter values to calculate.</div><p class="small muted">Illustrative calculation only. Not personalised financial advice.</p></div></div></main><footer class="footer"><div class="container footer-bottom">© 2026 Fynvera.</div></footer><script>/* Calculator formula: kept in one block for easy maintenance. */const result=t=>document.getElementById('out').textContent=t;const current=document.getElementById("current").value;const monthly=document.getElementById("monthly").value;const rate=document.getElementById("rate").value;const years=document.getElementById("years").value;document.getElementById('calculate').onclick=()=>{const p=+current||0,m=+monthly||0,r=(+rate||0)/100/12,n=(+years||0)*12;let v=p;for(let i=0;i<n;i++)v=v*(1+r)+m;result(`Illustrative balance: ${v.toLocaleString(undefined,{maximumFractionDigits:2})}`);}</script></body></html>
