r debts</label><input id="debt" type="number" min="0" step="any" placeholder="0"></div><button class="btn btn-primary" id="calculate">Calculate</button><div id="out" class="result">Enter values to calculate.</div><p class="small muted">Illustrative calculation only. Not personalised financial advice.</p></div></div></main><footer class="footer"><div class="container footer-bottom">© 2026 Fynvera.</div></footer><script>/* Calculator formula: kept in one block for easy maintenance. */const result=t=>document.getElementById('out').textContent=t;const cash=document.getElementById("cash").value;const investments=document.getElementById("investments").value;const property=document.getElementById("property").value;const other=document.getElementById("other").value;const loans=document.getElementById("loans").value;const cards=document.getElementById("cards").value;const debt=document.getElementById("debt").value;document.getElementById('calculate').onclick=()=>{const a=['cash','investments','property','other'].reduce((s,id)=>s+(+document.getElementById(id).value||0),0),d=['loans','cards','debt'].reduce((s,id)=>s+(+document.getElementById(id).value||0),0);result(`Estimated net worth: ${(a-d).toLocaleString(undefined,{maximumFractionDigits:2})}`);}</script></body></html>
